<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E1621" />
<link rel="icon" type="image/png" href="icon.png" />
<title>TON Board</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* Telegram's own dark palette — navy, not flat black — so cards sit
       visibly above the background instead of blending into it. */
    --bg:#0E1621; --bg-2:#0A0F17;
    --card:#182533; --card-2:#20303F; --card-press:#24384A;
    --line:rgba(0,152,234,.22); --line-soft:rgba(255,255,255,.06);
    --text:#F2F6FC; --muted:#8996A8;
    --ton-a:#0098EA; --ton-b:#00D2FF;
    --up:#3DDC97; --down:#FF5D7A; --warn:#F5B942;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);height:100%;
    font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{position:relative;overflow-x:hidden}
  /* Faint grain for physical texture — the kind of detail templated
     gradient-blob UIs skip. */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    opacity:.035;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  .tabular{font-variant-numeric:tabular-nums}
  .addr{font-family:var(--font-mono)}
  .wrap{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
  a{color:inherit}

  /* ---------- Persistent app header (outside the sliding screens, so the
     wallet-connect button — which TonConnect mounts into one fixed DOM
     node — stays visible whichever screen is showing) ---------- */
  .apphead{flex:none;background:rgba(14,22,33,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    display:flex;align-items:center;gap:7px}
  .diamond{flex:none;width:22px;height:22px;border-radius:6px;
    background:linear-gradient(135deg,var(--ton-a),var(--ton-b));
    transform:rotate(45deg);box-shadow:0 0 14px rgba(0,152,234,.45)}
  .brandname{font-size:15px;font-weight:600;letter-spacing:-.005em}
  .live{display:flex;align-items:center}
  .live .dot{width:6px;height:6px;border-radius:50%;background:var(--up);
    box-shadow:0 0 0 0 rgba(61,220,151,.5);animation:pulse 2s infinite}
  .live.err .dot{background:var(--down);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.45)}
    70%{box-shadow:0 0 0 6px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
  @media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
  #ton-connect-button{flex:none;max-width:150px}
  .headicon{margin-left:auto}

  /* ---------- Screen stack (Telegram-style push navigation) ---------- */
  .screens{position:relative;flex:1;min-height:0;overflow:hidden}
  .screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:var(--bg);transition:transform .32s cubic-bezier(.22,.61,.36,1);will-change:transform}
  #screen-list{transform:translateX(0)}
  #screen-list.behind{transform:translateX(-22%);pointer-events:none}
  #screen-detail{transform:translateX(100%)}
  #screen-detail.active{transform:translateX(0)}
  #screen-portfolio{transform:translateX(100%)}
  #screen-portfolio.active{transform:translateX(0)}
  @media (prefers-reduced-motion:reduce){.screen{transition:none}}

  /* ---------- Top bar (per-screen, below the persistent app header) ---------- */
  .topbar{position:sticky;top:0;z-index:5;background:rgba(14,22,33,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);
    padding:10px 14px}
  .searchrow{display:flex;gap:8px;align-items:center}
  .searchpill{flex:1;display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line-soft);border-radius:999px;
    padding:10px 14px;min-width:0}
  .searchpill svg{flex:none;opacity:.5}
  .searchpill input{flex:1;min-width:0;background:none;border:none;outline:none;
    color:var(--text);font-family:inherit;font-size:13.5px}
  .searchpill input::placeholder{color:var(--muted)}
  .iconbtn{flex:none;width:38px;height:38px;border-radius:999px;background:var(--card);
    border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease}
  .iconbtn:active{transform:scale(.92)}
  .iconbtn svg{width:16px;height:16px}
  .iconbtn.spin svg{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Pull to refresh ---------- */
  .ptr{position:absolute;top:6px;left:50%;
    transform:translate(-50%,-50px);opacity:0;z-index:4;
    width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ton-b);
    box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
  .ptr svg{width:16px;height:16px}
  .ptr.spinning svg{animation:spin .7s linear infinite}

  main{padding:14px 14px 40px}

  /* ---------- Section header (plain — no gradient card, the app's own
     elevation system does the visual work instead) ---------- */
  .sectionhead{padding:2px 2px 14px}
  .sectionhead-row{display:flex;align-items:baseline;gap:9px}
  .sectionhead h2{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em}
  .countpill{font-size:11px;font-weight:600;color:var(--ton-b);background:rgba(0,152,234,.14);
    border:1px solid rgba(0,152,234,.3);border-radius:7px;padding:2px 7px}
  .sectionsub{color:var(--muted);font-size:12.5px;margin:4px 0 12px;line-height:1.4}
  .sortrow{display:flex;gap:7px}
  .sortpill,.rangepill{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--card-2);
    border:1px solid var(--line-soft);border-radius:999px;padding:6px 12px;transition:transform .12s ease}
  .sortpill:active,.rangepill:active{transform:scale(.95)}
  .sortpill.active,.rangepill.active{color:#03131f;background:linear-gradient(135deg,var(--ton-a),var(--ton-b));
    border-color:transparent}

  .spot-eyebrow{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.07em;margin:0 2px 8px}

  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.tcard,.spotlight{animation:none !important}}

  /* ---------- Spotlight (top pick — breaks the grid's uniformity) ---------- */
  .spotlight{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px;
    margin-bottom:12px;box-shadow:0 8px 22px -10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
    transition:transform .12s ease,background .12s ease;animation:cardIn .3s ease both}
  .spotlight:active{transform:scale(.98);background:var(--card-press)}
  .spot-media{flex:none;width:52px;height:52px;border-radius:13px;overflow:hidden;position:relative;
    background:var(--card-2)}
  .spot-media img{width:100%;height:100%;object-fit:cover;display:block}
  .spot-media .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, rgba(0,152,234,.35), rgba(0,210,255,.12));
    font-size:20px;font-weight:700;color:rgba(242,246,252,.85)}
  .spot-body{flex:1;min-width:0}
  .spot-top{display:flex;align-items:center;gap:6px;min-width:0}
  .spot-name{font-size:14.5px;font-weight:700;letter-spacing:-.005em;min-width:0;flex:0 1 auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spot-badge{flex:none;font-size:8.5px;font-weight:600;color:var(--ton-b);background:rgba(0,152,234,.14);
    border:1px solid rgba(0,152,234,.3);border-radius:5px;padding:2px 5px;text-transform:uppercase}
  .spot-badge.warn{color:var(--warn);background:rgba(245,185,66,.12);border-color:rgba(245,185,66,.35)}
  .spot-ticker{color:var(--muted);font-size:11.5px;margin-top:1px}
  .spot-stats{flex:none;text-align:right;max-width:38%}
  .spot-price{font-size:13px;font-weight:600;white-space:nowrap}
  .spot-price .muted{color:var(--muted);font-weight:500}
  .spot-chg{font-size:11.5px;margin-top:2px;font-weight:600}

  /* ---------- Token grid ---------- */
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
    overflow:hidden;text-align:left;transition:transform .12s ease,background .12s ease;
    box-shadow:0 8px 22px -10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
    animation:cardIn .3s ease both}
  .tcard:active{transform:scale(.97);background:var(--card-press)}
  .tmedia{position:relative;width:100%;aspect-ratio:1/1;background:var(--card-2);
    display:flex;align-items:center;justify-content:center}
  .tmedia img{width:100%;height:100%;object-fit:cover;display:block}
  .tmedia .fallback{width:100%;height:100%;
    background:linear-gradient(135deg, rgba(0,152,234,.35), rgba(0,210,255,.12));
    display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:700;color:rgba(242,246,252,.85)}
  .tbadge{position:absolute;top:8px;left:8px;font-size:9px;font-weight:600;color:var(--text);
    background:rgba(10,15,23,.7);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.12);
    border-radius:6px;padding:3px 7px;text-transform:uppercase;letter-spacing:.03em;
    max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbadge.warn{color:var(--warn);border-color:rgba(245,185,66,.4)}
  .tbody{padding:9px 10px 11px}
  .tname{font-size:13.5px;font-weight:700;letter-spacing:-.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tticker{color:var(--muted);font-size:11px;margin-top:1px}
  .tprice{font-size:12px;margin-top:7px}
  .tprice b{font-weight:600}
  .tprice .muted{color:var(--muted);font-weight:500}
  .tchg{font-size:11px;margin-top:3px;font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)}
  .tfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:9.5px;margin-top:7px}

  /* ---------- Loading skeletons ---------- */
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .skel{background:linear-gradient(90deg, var(--card-2) 25%, var(--card-press) 37%, var(--card-2) 63%);
    background-size:400% 100%;animation:shimmer 1.4s ease infinite}
  .skel-line{height:9px;border-radius:5px}
  .spot-skel{height:74px;border-radius:16px;margin-bottom:12px}
  .tcard-skel .tmedia{aspect-ratio:1/1}

  /* ---------- Empty / error states ---------- */
  .state{grid-column:1/-1;color:var(--muted);text-align:center;padding:50px 20px;font-size:12.5px;
    line-height:1.6}
  .state svg{opacity:.45}
  .state b{color:var(--text)}

  /* ---------- Portfolio screen ---------- */
  .portfolio-head{text-align:center;padding:22px 14px}
  .portfolio-head .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .portfolio-total{font-size:32px;font-weight:700;letter-spacing:-.01em;margin-top:6px}

  /* ---------- Detail screen ---------- */
  /* No in-page back button — Telegram's own native BackButton (wired in JS
     below) is the only back affordance, so there's just one, not two. */
  .detail-content{padding:14px 14px 40px}

  /* Manually-curated full-screen backdrop (see content.js) — a fixed layer
     behind the whole scrolling screen (not just a small banner). The image
     is drawn at its natural aspect ratio (not stretched/cropped to cover),
     and `background-color` is the curator-picked solid color the image's
     own bottom fades to — chosen to match exactly, so the image blends
     into a flat color with no visible seam, and everything scrolled below
     it stays that same color (not the app's normal dark theme — this
     token's whole page is themed to its art). #screen-detail always has
     its own `transform` (the slide-nav CSS below), which makes it the
     containing block for this fixed child — so it stays pinned to the
     screen, not the true page, and works with the existing screen-slide
     navigation. Only renders for tokens someone has actually designed one
     for — no auto-generated/stretched-logo fallback. */
  .detail-bg{position:fixed;inset:0;z-index:0;
    background-repeat:no-repeat;background-position:top center;background-size:100% auto}
  .detail-bg[hidden]{display:none}
  .detail-content{position:relative;z-index:1}
  /* Reserves space at the top of the scrolling content so cards start
     below the hero image's own heading/artwork instead of covering it —
     height is set per-token (content.js's heroSpace) since every image's
     "header zone" is a different height. */
  .hero-space{width:100%}

  /* ---------- Theses ---------- */
  .thesis-list{display:flex;flex-direction:column;gap:12px}
  .thesis{background:var(--card-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px}
  .thesis-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .thesis-avatar{width:26px;height:26px;border-radius:50%;flex:none;overflow:hidden;
    background:var(--card-press);display:block}
  .thesis-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .thesis-avatar .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--ton-b)}
  .thesis-author{font-size:12.5px;font-weight:600;color:var(--text)}
  .thesis-date{font-size:10.5px;color:var(--muted);margin-top:1px}
  .thesis-title{font-size:13.5px;font-weight:700;margin-bottom:6px;letter-spacing:-.005em}
  .thesis-body{font-size:12.5px;line-height:1.65;color:#C7CEDB;white-space:pre-wrap;margin:0}
  .thesis-source{display:inline-block;margin-top:9px;font-size:11px;font-weight:600;
    color:var(--ton-b);text-decoration:none}

  .dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:12px;box-shadow:0 8px 22px -10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03)}
  .dcard h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:0 0 10px;font-weight:600}
  .desc{font-size:12.5px;line-height:1.55;color:#C7CEDB;margin:0 0 12px}
  /* Sized to match the reference app's pills 1:1 (measured off a real
     screenshot: ~14px badge in a ~30px-tall capsule, 12px label) — small,
     content-hugging chips that wrap, not stretched grid cells. Sits
     inline with the contract-address chip in .metarow below. */
  .ilink{display:inline-flex;align-items:center;gap:7px;border-radius:999px;text-decoration:none;
    border:1px solid var(--line-soft);background:var(--card-2);padding:7px 11px 7px 10px;
    transition:transform .12s ease,background .12s ease;overflow:hidden}
  .ilink:active{transform:scale(.97);background:var(--card-press)}
  .ilabel{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap}
  .ibadge{width:14px;height:14px;flex:none;border-radius:4px;display:flex;
    align-items:center;justify-content:center;color:var(--ton-b);overflow:hidden}
  .ibadge svg{width:11px;height:11px}
  /* Real app icons (Dexscreener, GeckoTerminal, X, Telegram) — the badge
     background is baked into the source image itself, so the image fills
     the badge slot full-bleed with no extra background of our own. */
  .ibadge img{width:100%;height:100%;object-fit:cover;display:block}
  .ibadge-telegram{border-radius:999px}

  .tokhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .tokhead .icon{width:44px;height:44px;border-radius:12px;flex:none;overflow:hidden;
    background:var(--card-2)}
  .tokhead .icon img{width:100%;height:100%;object-fit:cover}
  .tokhead .icon .fallback{width:100%;height:100%;display:flex;
    align-items:center;justify-content:center;
    background:linear-gradient(135deg, rgba(0,152,234,.35), rgba(0,210,255,.12));
    font-weight:700;font-size:16px}
  .tokhead .nm{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .tokhead .tk{color:var(--muted);font-size:12px;margin-top:1px}
  .metarow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 14px}
  .addrrow{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}
  .addrrow svg{width:12px;height:12px;opacity:.6;flex:none}
  .addrrow.copied{color:var(--up)}
  .addrrow.copied svg{opacity:1}

  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
    margin-bottom:4px}
  .stat .v{font-size:14.5px;font-weight:600}

  .pricehead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .pricehead .big{font-size:25px;font-weight:700;letter-spacing:-.01em}
  .pricehead .chg{font-size:13px;font-weight:600}

  .rangerow{display:flex;gap:6px;margin-bottom:10px}
  .chartbox{height:90px}
  .chart-svg{width:100%;height:90px;display:block}
  .chart-empty{font-size:11px;color:var(--muted);text-align:center;padding:32px 8px;line-height:1.5}

  .trust{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .trust-item{background:var(--card-2);border:1px solid var(--line-soft);border-radius:9px;
    padding:8px 10px}
  .trust-item .k{font-size:9.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:3px}
  .trust-item .v{font-size:12.5px;font-weight:500}
  .v.ok{color:var(--up)} .v.bad{color:var(--down)} .v.unk{color:var(--warn)} .v.info{color:var(--text)}

  .holderbar{height:7px;border-radius:4px;overflow:hidden;display:flex;
    background:var(--card-2);margin-top:6px}
  .holderbar span{height:100%}
  .holdercap{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);
    margin-top:8px}
  .trustnote{font-size:9.5px;color:var(--muted);margin-top:10px;line-height:1.5}

  .tradetabs{display:flex;gap:4px;background:var(--card-2);border:1px solid var(--line-soft);
    border-radius:12px;padding:3px;margin-bottom:14px}
  .tradetab{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted);
    background:none;border:none;border-radius:9px;padding:9px 0;transition:background .15s ease,color .15s ease}
  .tradetab.active{color:#03131f}
  .tradetab.buy-mode.active{background:linear-gradient(135deg,var(--ton-a),var(--ton-b))}
  .tradetab.sell-mode.active{background:linear-gradient(135deg,#FF8A65,var(--down))}

  .amountrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .amountlabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .balancehint{font-size:11px;color:var(--muted)}
  .balancehint b{color:var(--text);font-weight:600}
  .amountinput{display:flex;align-items:center;gap:10px;background:var(--card-2);
    border:1px solid var(--line-soft);border-radius:12px;padding:13px 14px;margin-bottom:12px}
  .amountinput input{flex:1;width:0;background:none;border:none;outline:none;color:var(--text);
    font-size:21px;font-weight:700;text-align:left;font-variant-numeric:tabular-nums}
  .amountinput input::-webkit-outer-spin-button,.amountinput input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0}
  .amountunit{flex:none;color:var(--text);font-size:12.5px;font-weight:700;background:var(--card-press);
    border-radius:999px;padding:6px 12px}
  .presetrow{display:flex;gap:6px;margin-bottom:12px}
  .presetrow[hidden]{display:none}
  .presetpill{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);
    background:var(--card-2);border:1px solid var(--line-soft);border-radius:8px;padding:6px 0;
    transition:transform .12s ease}
  .presetpill:active{transform:scale(.95);color:var(--ton-b);border-color:rgba(0,152,234,.3)}
  .swappreview{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;
    padding:10px 12px;margin-bottom:12px;display:none}
  .swappreview.show{display:block}
  .swappreview-row{display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;padding:3px 0}
  .swappreview-row .k{color:var(--muted)}
  .swappreview-row .v{font-weight:600}
  .swappreview-row .v.primary{font-size:15px;font-weight:800;color:var(--text)}
  .swappreview-row .v.warn{color:var(--warn)}
  .swappreview-row .v.bad{color:var(--down)}
  .swappreview-loading,.swappreview-err{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
  .swappreview-err{color:var(--down)}
  .ca-row{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
    margin-top:12px;padding:8px 0 2px;background:none;border:none;font-size:11px;color:var(--muted)}
  .ca-row .k{text-transform:uppercase;letter-spacing:.05em;font-size:9.5px}
  .ca-row svg{width:12px;height:12px;opacity:.6;flex:none}
  .ca-row.copied{color:var(--up)}
  .ca-row.copied svg{opacity:1}

  .buy{display:block;width:100%;text-align:center;text-decoration:none;font-weight:700;font-size:14px;
    color:#03131f;background:linear-gradient(135deg,var(--ton-a),var(--ton-b));
    box-shadow:0 6px 16px -6px rgba(0,152,234,.55);
    border-radius:12px;padding:14px;letter-spacing:.01em;margin-top:4px;transition:transform .12s ease,box-shadow .15s ease}
  .buy:active{transform:scale(.98)}
  .buy:disabled{opacity:.6;box-shadow:none}
  .buy.sell-mode{background:linear-gradient(135deg,#FF8A65,var(--down));box-shadow:0 6px 16px -6px rgba(255,93,122,.55)}
  /* Inside real Telegram, Telegram's own MainButton is the primary CTA
     (feels native at the bottom of the app) — the in-page button steps
     aside so there's only one Buy affordance, not two. */
  body.in-telegram .buy{display:none}
  .buystatus{font-size:11px;text-align:center;margin-top:8px;line-height:1.5;min-height:14px}
  .buystatus.ok{color:var(--up)}
  .buystatus.err{color:var(--down)}
  .fallbacklink{display:block;text-align:center;font-size:10.5px;color:var(--muted);
    text-decoration:none;margin-top:10px}
  .fallbacklink:active{opacity:.7}
  .feenote{text-align:center;font-size:9.5px;color:var(--muted);margin-top:8px;line-height:1.5}

  footer{color:var(--muted);font-size:10px;text-align:center;padding:20px 24px 30px;
    line-height:1.6;border-top:1px solid var(--line-soft);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

  <div class="apphead">
    <div class="diamond"></div>
    <span class="brandname">TON Board</span>
    <span class="live" id="liveIndicator" title="live"><span class="dot"></span></span>
    <button class="iconbtn headicon" id="portfolioBtn" onclick="showPortfolio()" aria-label="My Coins" title="My Coins">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M2 13h20"/></svg>
    </button>
    <div id="ton-connect-button"></div>
  </div>

  <div class="screens">
  <!-- ===================== LIST SCREEN ===================== -->
  <div class="screen" id="screen-list">
    <div class="ptr" id="ptr">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 12a9 9 0 1 1-2.6-6.36"/><path d="M21 3v6h-6"/></svg>
    </div>
    <div class="topbar">
      <div class="searchrow">
        <div class="searchpill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="text" inputmode="search" placeholder="Search loaded tokens" oninput="onSearch()" />
        </div>
        <button class="iconbtn" id="refreshBtn" onclick="load()" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 12a9 9 0 1 1-2.6-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>

    <main>
      <div class="sectionhead">
        <div class="sectionhead-row"><h2>Trending</h2><span class="countpill tabular" id="countpill">0</span></div>
        <p class="sectionsub">Top TON tokens by 24h volume — screened for basic risk signals.</p>
        <div class="sortrow">
          <button class="sortpill active" id="sortVolume" onclick="setSort('volume')">Volume</button>
          <button class="sortpill" id="sortGainers" onclick="setSort('gainers')">Gainers</button>
        </div>
      </div>

      <div class="spot-eyebrow" id="spotEyebrow">Top by volume</div>
      <div id="spotlight"></div>
      <div class="tgrid" id="grid"></div>
    </main>

    <footer>
      Market data by GeckoTerminal. Buys route through STON.fi, non‑custodial —<br/>
      your wallet signs every transaction, this app never holds funds.<br/>
      Not financial advice. Memecoins are high risk.
    </footer>
  </div>

  <!-- ===================== DETAIL SCREEN ===================== -->
  <div class="screen" id="screen-detail">
    <div class="detail-bg" id="detailBg" hidden></div>
    <div class="detail-content" id="detailContent"></div>
  </div>

  <!-- ===================== PORTFOLIO SCREEN ===================== -->
  <div class="screen" id="screen-portfolio">
    <div class="detail-content" id="portfolioContent"></div>
  </div>
  </div>

</div>

<script src="content.js"></script>
<script>
  const tg = window.Telegram?.WebApp;
  if (tg){
    tg.ready(); tg.expand();
    try { tg.setBackgroundColor?.('#0E1621'); tg.setHeaderColor?.('#0E1621'); } catch(e){}
    tg.BackButton?.onClick(() => showList());
  }

  // ---- Config ----
  const REFERRAL_ADDRESS = "EQA7NubDDzupeKWC-hmTlCugHfySLrxftL9cwImY_wVPYMG9";
  const REFERRAL_VALUE = 30; // units of 0.01% => 0.30%
  const GT_BASE = "https://api.geckoterminal.com/api/v2";
  const NETWORK = "ton";
  const WANT = 10;

  let allCoins = [];
  let sortMode = 'volume';
  let searchTerm = '';
  let currentDetailCoin = null;
  let currentChartRange = '24h';
  const chartCache = {};

  function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
  const fmtPrice = (p) => {
    p = Number(p)||0;
    if (!p) return "$0";
    if (p >= 1) return "$" + p.toFixed(3);
    const s = p.toFixed(12).replace(/0+$/,"");
    const m = s.match(/^0\.(0*)(\d{1,4})/);
    return m ? "$0." + m[1] + m[2] : "$" + p.toPrecision(3);
  };
  const fmtNum = (n) => {
    n = Number(n)||0;
    if (n >= 1e9) return (n/1e9).toFixed(1)+"B";
    if (n >= 1e6) return (n/1e6).toFixed(1)+"M";
    if (n >= 1e3) return (n/1e3).toFixed(1)+"K";
    return Math.round(n).toString();
  };
  const fmtChg = (c) => { c = Number(c)||0; return (c>=0?"+":"") + c.toFixed(1) + "%"; };
  const fmtPct = (v) => v==null ? "—" : Number(v).toFixed(1)+"%";
  const fmtUsd = (v) => v==null ? "—" : "$"+fmtNum(v);
  const truncAddr = (a) => !a ? "—" : a.slice(0,6)+"…"+a.slice(-4);
  const fmtAge = (iso) => {
    if (!iso) return "—";
    const t = new Date(iso).getTime();
    if (!t) return "—";
    const diff = Date.now() - t;
    const days = Math.floor(diff/86400000);
    if (days >= 1) return days+"d ago";
    const hours = Math.floor(diff/3600000);
    if (hours >= 1) return hours+"h ago";
    return Math.max(1, Math.floor(diff/60000))+"m ago";
  };

  function launchpadFromDescription(desc){
    if (!desc) return null;
    const m = desc.match(/Deployed from ([a-zA-Z0-9.\-]+)/i);
    return m ? m[1] : null;
  }

  async function fetchJson(url, tries = 3){
    let delay = 600;
    for (let i = 0; i < tries; i++) {
      try {
        const res = await fetch(url, { headers: { accept: "application/json" } });
        if (res.status === 429) { await sleep(delay); delay *= 2; continue; }
        if (!res.ok) throw new Error(res.status + " for " + url);
        return await res.json();
      } catch (e) {
        // "Failed to fetch" = no response reached JS at all (rate-limit/edge
        // block without CORS headers, or a network hiccup) — worth retrying.
        const isNetworkLevel = e instanceof TypeError;
        if (isNetworkLevel && i < tries - 1) { await sleep(delay); delay *= 2; continue; }
        if (isNetworkLevel) {
          throw new Error("Network blocked the request — most likely GeckoTerminal's free-tier rate limit (30 requests/minute), tripped by a few taps around the app. Could also be an ad-blocker/privacy extension. Wait about a minute and try again.");
        }
        throw e;
      }
    }
  }
  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  function buyUrl(tokenAddress){
    // v1 fallback: direct link to STON.fi's own swap UI with our referral params
    // in the URL. Part 2 of the build replaces the primary flow with an
    // embedded TonConnect + STON.fi SDK transaction (see spec) so the referral
    // fee is guaranteed by the transaction itself, not a URL param STON.fi has
    // to honor. Keeping this link path working as the documented fallback.
    return "https://app.ston.fi/swap?ft=TON&tt=" + encodeURIComponent(tokenAddress) +
      "&referral_address=" + encodeURIComponent(REFERRAL_ADDRESS) +
      "&referral_value=" + REFERRAL_VALUE;
  }

  function tokenIconHtml(coin){
    if (coin.imageUrl) return `<img src="${esc(coin.imageUrl)}" loading="lazy" alt="" onerror="this.parentElement.innerHTML='<div class=fallback>${esc((coin.symbol||'?')[0])}</div>'"/>`;
    return `<div class="fallback">${esc((coin.symbol||'?')[0])}</div>`;
  }

  function priceRowHtml(coin){
    if (coin.marketCapUsd != null) {
      return `<b>${fmtUsd(coin.marketCapUsd)}</b> <span class="muted">MC</span>` +
        (coin.fdvUsd != null && coin.fdvUsd !== coin.marketCapUsd ? ` / ${fmtUsd(coin.fdvUsd)} FDV` : "");
    }
    if (coin.fdvUsd != null) return `<b>${fmtUsd(coin.fdvUsd)}</b> <span class="muted">FDV</span>`;
    return `<span class="muted">MC —</span>`;
  }

  function compactPriceHtml(coin){
    if (coin.marketCapUsd != null) return `<b>${fmtUsd(coin.marketCapUsd)}</b> <span class="muted">MC</span>`;
    if (coin.fdvUsd != null) return `<b>${fmtUsd(coin.fdvUsd)}</b> <span class="muted">FDV</span>`;
    return `<span class="muted">—</span>`;
  }

  function renderSpotlight(coin, idx){
    const dir = coin.change24h >= 0 ? "up" : "down";
    const hp = coin.is_honeypot;
    const badgeText = hp === true ? "Honeypot?" : coin.launchpad;
    return `
    <button class="spotlight" onclick="showDetail(${idx})" style="animation-delay:0ms">
      <div class="spot-media">${tokenIconHtml(coin)}</div>
      <div class="spot-body">
        <div class="spot-top">
          <span class="spot-name">${esc(coin.name)}</span>
          ${badgeText ? `<span class="spot-badge${hp===true?' warn':''}">${esc(badgeText)}</span>` : ""}
        </div>
        <div class="spot-ticker">$${esc(coin.symbol)}</div>
      </div>
      <div class="spot-stats">
        <div class="spot-price tabular">${compactPriceHtml(coin)}</div>
        <div class="spot-chg tabular ${dir}">${fmtChg(coin.change24h)}</div>
      </div>
    </button>`;
  }

  function renderCard(coin, idx, delayMs){
    const dir = coin.change24h >= 0 ? "up" : "down";
    const hp = coin.is_honeypot;
    const badgeText = hp === true ? "Honeypot?" : coin.launchpad;
    const badgeWarn = hp === true;

    return `
    <button class="tcard" onclick="showDetail(${idx})" style="animation-delay:${delayMs}ms">
      <div class="tmedia">
        ${badgeText ? `<span class="tbadge${badgeWarn?' warn':''}">${esc(badgeText)}</span>` : ""}
        ${tokenIconHtml(coin)}
      </div>
      <div class="tbody">
        <div class="tname">${esc(coin.name)}</div>
        <div class="tticker">$${esc(coin.symbol)}</div>
        <div class="tprice tabular">${priceRowHtml(coin)}</div>
        <div class="tchg tabular ${dir}">${fmtChg(coin.change24h)}</div>
        <div class="tfoot">
          <span class="addr">${esc(truncAddr(coin.tokenAddress))}</span>
          <span class="tabular">${esc(fmtAge(coin.poolCreatedAt))}</span>
        </div>
      </div>
    </button>`;
  }

  function skeletonCard(){
    return `<div class="tcard tcard-skel">
      <div class="tmedia skel"></div>
      <div class="tbody">
        <div class="skel skel-line" style="width:70%"></div>
        <div class="skel skel-line" style="width:40%;margin-top:6px"></div>
        <div class="skel skel-line" style="width:55%;margin-top:10px"></div>
      </div>
    </div>`;
  }

  function emptyIcon(){
    return `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`;
  }
  function errorIcon(){
    return `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`;
  }

  function trustChip(label, value, kind){
    return `<div class="trust-item"><div class="k">${esc(label)}</div><div class="v ${kind}">${esc(value)}</div></div>`;
  }

  function thesisCard(t){
    const initial = esc((t.author || "?")[0]);
    const avatarInner = t.avatarUrl
      ? `<img src="${esc(t.avatarUrl)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=fallback>${initial}</div>'"/>`
      : `<div class="fallback">${initial}</div>`;
    return `
      <div class="thesis">
        <div class="thesis-head">
          <span class="thesis-avatar">${avatarInner}</span>
          <div>
            <div class="thesis-author">${esc(t.author || "Anonymous")}</div>
            ${t.date ? `<div class="thesis-date">${esc(t.date)}</div>` : ""}
          </div>
        </div>
        ${t.title ? `<div class="thesis-title">${esc(t.title)}</div>` : ""}
        <p class="thesis-body">${esc(t.body || "")}</p>
        ${t.sourceUrl ? `<a class="thesis-source" href="${esc(t.sourceUrl)}" target="_blank" rel="noopener">View original →</a>` : ""}
      </div>`;
  }

  const LINK_ICONS = {
    website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>',
  };
  // Real app icons, cropped directly from the actual X and Telegram app
  // icons (not redrawn/approximated) — rendered as <img> so the badge
  // look matches other apps exactly.
  const LINK_IMAGES = {
    telegram: "icons/telegram.png",
    x: "icons/x.png",
  };
  function iconLink(url, kind, label){
    if (!url) return "";
    const badge = LINK_IMAGES[kind]
      ? `<span class="ibadge ibadge-${kind}"><img src="${LINK_IMAGES[kind]}" alt="" loading="lazy" /></span>`
      : `<span class="ibadge">${LINK_ICONS[kind]}</span>`;
    return `<a class="ilink" href="${esc(url)}" target="_blank" rel="noopener" aria-label="${esc(label)}" title="${esc(label)}">${badge}<span class="ilabel">${esc(label)}</span></a>`;
  }

  function renderDetail(coin){
    const dir = coin.change24h >= 0 ? "up" : "down";
    const hp = coin.is_honeypot;
    const hpLabel = hp === true ? "Yes — risk" : hp === false ? "No" : "Unknown";
    const hpKind = hp === true ? "bad" : hp === false ? "ok" : "unk";
    const top10 = coin.holderTop10 != null ? Number(coin.holderTop10) : null;
    const rest = top10 != null ? Math.max(0, 100 - top10) : null;

    // GeckoTerminal doesn't populate every trust field for every network —
    // TON tokens in particular often come back with GT score, holder count
    // and dev-holding all null. Showing a row of "—" placeholders looks
    // broken, so only render a chip when there's a real value, and skip
    // the whole card if nothing came back at all.
    const trustChips = [];
    if (coin.gtScore != null) {
      trustChips.push(trustChip("GT score", coin.gtScore.toFixed(0) + "/100",
        coin.gtScore >= 66 ? "ok" : coin.gtScore >= 33 ? "unk" : "bad"));
    }
    if (coin.holderCount != null) {
      trustChips.push(trustChip("Holders", coin.holderCount, "info"));
    }
    if (hp === true || hp === false) {
      trustChips.push(trustChip("Honeypot", hpLabel, hpKind));
    }
    if (coin.devHoldingPct != null) {
      trustChips.push(trustChip("Dev holds", fmtPct(coin.devHoldingPct), coin.devHoldingPct > 10 ? "bad" : "ok"));
    }
    const hasTrustData = trustChips.length > 0 || top10 != null;

    // Manually-curated content (content.js) — see that file for the shape.
    // Nothing here is pulled from any API; a token with no entry just
    // renders the plain default page below.
    const content = (typeof TOKEN_CONTENT !== "undefined" && TOKEN_CONTENT[coin.tokenAddress]) || null;

    // GeckoTerminal frequently has no socials at all for TON tokens — same
    // gap as the trust fields — so a manually-set link in content.js fills
    // in (or overrides) whatever the auto-pulled coin data is missing.
    const website = content?.website || coin.website;
    const telegram = content?.telegram || coin.telegram;
    const twitter = content?.twitter || coin.twitter;
    const iconLinks = [
      iconLink(website, "website", "Website"),
      iconLink(telegram ? `https://t.me/${telegram}` : null, "telegram", "Telegram"),
      iconLink(twitter ? `https://x.com/${twitter}` : null, "x", "X"),
    ].filter(Boolean);

    const bgEl = document.getElementById("detailBg");
    if (bgEl) {
      if (content?.hero) {
        bgEl.hidden = false;
        bgEl.style.backgroundImage = `url("${esc(content.hero)}")`;
        bgEl.style.backgroundColor = content.bgColor || "";
      } else {
        bgEl.hidden = true;
        bgEl.style.backgroundImage = "";
        bgEl.style.backgroundColor = "";
      }
    }

    const description = content?.description
      ? `<p class="desc">${esc(content.description)}</p>`
      : coin.description
      ? `<p class="desc">${esc(coin.description).slice(0,320)}${coin.description.length>320?'…':''}</p>`
      : `<p class="desc" style="color:var(--muted)">No description available.</p>`;

    const thesesHtml = content?.theses?.length ? `
      <div class="dcard">
        <h3>Theses</h3>
        <div class="thesis-list">${content.theses.map(thesisCard).join("")}</div>
      </div>` : "";

    // heroSpace is a fraction of the rendered width, not a fixed px value —
    // the image itself scales with screen width (background-size:100%
    // auto), so the space reserved for it needs to scale the same way or
    // narrower/wider phones end up with a gap that's too big or too small.
    const heroSpacePx = content?.hero
      ? Math.round((Number(content.heroSpace) || 0.85) * (document.getElementById("screen-detail")?.clientWidth || window.innerWidth))
      : 0;

    document.getElementById("detailContent").innerHTML = `
      ${content?.hero
        ? `<div class="hero-space" style="height:${heroSpacePx}px"></div>`
        : `<div class="tokhead">
             <div class="icon">${tokenIconHtml(coin)}</div>
             <div>
               <div class="nm">${esc(coin.name)}</div>
               <div class="tk addr">$${esc(coin.symbol)}</div>
             </div>
           </div>`}
      <div class="metarow">
        <div class="addrrow" onclick="window.copyAddr?.('${esc(coin.tokenAddress)}', this)">
          <span class="addr addrtext">${esc(truncAddr(coin.tokenAddress))}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </div>
        ${iconLinks.join("")}
      </div>

      <div class="dcard">
        <h3>About</h3>
        ${description}
      </div>

      ${thesesHtml}

      <div class="dcard">
        <div class="pricehead">
          <span class="big tabular">${fmtPrice(coin.priceUsd)}</span>
          <span class="chg tabular ${dir}">${fmtChg(coin.change24h)}</span>
        </div>
        <div class="rangerow">
          <button class="rangepill" data-range="1h" onclick="setChartRange('1h')">1H</button>
          <button class="rangepill active" data-range="24h" onclick="setChartRange('24h')">24H</button>
          <button class="rangepill" data-range="7d" onclick="setChartRange('7d')">7D</button>
          <button class="rangepill" data-range="30d" onclick="setChartRange('30d')">30D</button>
        </div>
        <div class="chartbox" id="chartBox"><div class="skel" style="width:100%;height:100%;border-radius:8px"></div></div>
        <div class="statgrid">
          <div class="stat"><div class="k">Market cap</div><div class="v tabular">${fmtUsd(coin.marketCapUsd)}</div></div>
          <div class="stat"><div class="k">Liquidity</div><div class="v tabular">${fmtUsd(coin.liquidityUsd)}</div></div>
          <div class="stat"><div class="k">24h volume</div><div class="v tabular">${fmtUsd(coin.volume24h)}</div></div>
          <div class="stat"><div class="k">Pool age</div><div class="v tabular">${esc(fmtAge(coin.poolCreatedAt))}</div></div>
        </div>
      </div>

      <div class="dcard" id="trustCard"${hasTrustData ? "" : ' style="display:none"'}>
        <h3>Trust signals</h3>
        <div class="trust" id="trustChips">${trustChips.join("")}</div>
        ${top10 != null ? `
        <div class="holdercap">
          <span>Top 10 holders: ${top10.toFixed(1)}%</span><span>Rest: ${rest.toFixed(1)}%</span>
        </div>
        <div class="holderbar">
          <span style="width:${top10}%;background:var(--warn)"></span>
          <span style="width:${rest}%;background:var(--ton-a)"></span>
        </div>` : ""}
        <div class="trustnote">Via GeckoTerminal and STON.fi — displayed as-is, not independently verified by us.</div>
      </div>

      <div class="dcard">
        <div class="tradetabs">
          <button class="tradetab buy-mode active" id="tabBuy" onclick="window.setTradeMode?.('buy')">Buy</button>
          <button class="tradetab sell-mode" id="tabSell" onclick="window.setTradeMode?.('sell')">Sell</button>
        </div>
        <div class="amountrow">
          <span class="amountlabel">Amount</span>
          <span class="balancehint" id="balanceHint"></span>
        </div>
        <div class="amountinput">
          <input type="number" id="buyAmount" inputmode="decimal" placeholder="0.0" min="0" step="0.01"
            oninput="this.dataset.exactNano=''; window.previewSwap?.()" />
          <span class="amountunit" id="amountUnit">TON</span>
        </div>
        <div class="presetrow" id="buyPresetRow">
          <button class="presetpill" onclick="window.setBuyAmount?.(0.5)">0.5</button>
          <button class="presetpill" onclick="window.setBuyAmount?.(1)">1</button>
          <button class="presetpill" onclick="window.setBuyAmount?.(2)">2</button>
          <button class="presetpill" onclick="window.setBuyAmount?.(5)">5</button>
          <button class="presetpill" onclick="window.setMaxBuy?.()">MAX</button>
        </div>
        <div class="presetrow" id="sellPresetRow" hidden>
          <button class="presetpill" onclick="window.setSellFraction?.(0.25)">25%</button>
          <button class="presetpill" onclick="window.setSellFraction?.(0.5)">50%</button>
          <button class="presetpill" onclick="window.setSellFraction?.(0.75)">75%</button>
          <button class="presetpill" onclick="window.setSellFraction?.(1)">MAX</button>
        </div>
        <div class="swappreview" id="swapPreview"></div>
        <button class="buy" id="buyBtn" onclick="window.handleTrade?.()">Connect wallet to buy</button>
        <div class="buystatus" id="buyStatus"></div>
        <button type="button" class="ca-row" onclick="window.copyAddr?.('${esc(coin.tokenAddress)}', this)">
          <span class="k">Contract</span>
          <span class="addr addrtext">${esc(truncAddr(coin.tokenAddress))}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
        <div class="feenote">non-custodial · your wallet signs · 0.3% platform fee<br/>Not financial advice. Memecoins are high risk.</div>
        <a class="fallbacklink" href="${buyUrl(coin.tokenAddress)}" target="_blank" rel="noopener">Having trouble? Trade $${esc(coin.symbol)} directly on STON.fi →</a>
      </div>
    `;
    // Reset to Buy on every fresh coin — otherwise a Sell selection made on
    // the previous coin would silently carry over (tab shows Buy, but the
    // wallet module still thinks it's selling the last coin viewed).
    window.setTradeMode?.('buy');
    window.refreshBuyUi?.();
    // If the wallet module (external CDN imports) never finished loading,
    // fall back to an honest disabled state instead of a button that looks
    // live but silently does nothing when tapped.
    setTimeout(() => {
      if (window.handleTrade) return;
      const btn = document.getElementById("buyBtn");
      if (btn) { btn.textContent = "Wallet unavailable — use link below"; btn.disabled = true; }
    }, 4000);
    loadStonfiTrustSignals(coin);
  }

  // STON.fi tags every jetton it lists with its own risk signals
  // (honeypot/suspicious/fake/blacklisted/deprecated, plus a liquidity
  // tier) — unlike GeckoTerminal's score/holder fields, these actually
  // populate for TON, and they come from the exchange we route trades
  // through. Loaded async (needs the wallet bundle's STON.fi client) and
  // appended to whatever GT-based chips already rendered synchronously.
  async function loadStonfiTrustSignals(coin){
    const card = document.getElementById("trustCard");
    const box = document.getElementById("trustChips");
    if (!card || !box) return;
    for (let tries = 0; tries < 20 && !window.loadAssetTrust; tries++) await sleep(200);
    if (window.currentDetailCoin !== coin || !window.loadAssetTrust) return;

    const asset = await window.loadAssetTrust(coin.tokenAddress);
    if (window.currentDetailCoin !== coin || !asset) return;

    const tags = asset.tags || [];
    const riskTags = tags.filter(t => ["asset:honeypot","asset:suspicious","asset:fake"].includes(t));
    const extra = [];

    if (asset.blacklisted || riskTags.length) {
      const reason = asset.blacklisted ? "Blacklisted" : riskTags.map(t => t.split(":").pop()).join(", ");
      extra.push(trustChip("STON.fi flag", reason, "bad"));
    } else {
      extra.push(trustChip("STON.fi listing", asset.community ? "Community token" : "Verified", asset.community ? "unk" : "ok"));
    }
    if (asset.deprecated) {
      extra.push(trustChip("Listing status", "Deprecated", "bad"));
    }
    const liqTag = tags.find(t => t.startsWith("asset:liquidity:"));
    if (liqTag) {
      const tier = liqTag.split(":").pop();
      const liqLabel = { no: "None", low: "Low", medium: "Medium", high: "High", very_high: "Very high" }[tier] || tier;
      const liqKind = (tier === "no" || tier === "low") ? "bad" : tier === "medium" ? "unk" : "ok";
      extra.push(trustChip("STON.fi liquidity", liqLabel, liqKind));
    }

    if (extra.length) {
      box.insertAdjacentHTML("beforeend", extra.join(""));
      card.style.display = "";
    }
  }

  function buildChartSvg(list){
    const closes = list.map(c => c[4]);
    const min = Math.min(...closes), max = Math.max(...closes);
    const span = (max - min) || 1;
    const w = 300, h = 90, pad = 4;
    const pts = closes.map((c, i) => {
      const x = pad + (i / (closes.length - 1)) * (w - pad * 2);
      const y = pad + (1 - (c - min) / span) * (h - pad * 2);
      return [x, y];
    });
    const up = closes[closes.length - 1] >= closes[0];
    const color = up ? "#3DDC97" : "#FF5D7A";
    const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");
    const area = line + ` L${pts[pts.length-1][0].toFixed(2)},${h-pad} L${pts[0][0].toFixed(2)},${h-pad} Z`;
    const gid = "cg" + Math.random().toString(36).slice(2, 8);
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="chart-svg">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".28"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${gid})" stroke="none"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  window.setChartRange = function(range){ tg?.HapticFeedback?.selectionChanged?.(); loadChart(range); };

  async function loadChart(range){
    currentChartRange = range;
    document.querySelectorAll(".rangepill").forEach(b => b.classList.toggle("active", b.dataset.range === range));
    const box = document.getElementById("chartBox");
    const coin = currentDetailCoin;
    if (!box || !coin) return;
    if (!coin.poolAddress) {
      box.innerHTML = `<div class="chart-empty">Chart unavailable — no pool address for this token.</div>`;
      return;
    }
    const key = coin.poolAddress + "_" + range;
    if (chartCache[key]) { box.innerHTML = chartCache[key]; return; }
    box.innerHTML = `<div class="skel" style="width:100%;height:100%;border-radius:8px"></div>`;
    try {
      const cfg = {
        "1h": { timeframe: "minute", aggregate: 1, limit: 60 },
        "24h": { timeframe: "hour", aggregate: 1, limit: 24 },
        "7d": { timeframe: "hour", aggregate: 4, limit: 42 },
        "30d": { timeframe: "day", aggregate: 1, limit: 30 },
      }[range] || { timeframe: "hour", aggregate: 1, limit: 24 };
      const res = await fetchJson(`${GT_BASE}/networks/${NETWORK}/pools/${coin.poolAddress}/ohlcv/${cfg.timeframe}?aggregate=${cfg.aggregate}&limit=${cfg.limit}&currency=usd`);
      const list = (res?.data?.attributes?.ohlcv_list || []).slice().sort((a, b) => a[0] - b[0]);
      if (list.length < 2) throw new Error("not enough candles yet for this pool");
      const svg = buildChartSvg(list);
      if (currentDetailCoin === coin && currentChartRange === range) {
        chartCache[key] = svg;
        box.innerHTML = svg;
      }
    } catch (e) {
      if (currentDetailCoin === coin && currentChartRange === range) {
        box.innerHTML = `<div class="chart-empty">Couldn't load chart.<br/>${esc(e.message || e)}</div>`;
      }
    }
  }

  window.showDetail = function(idx){
    const coin = allCoins[idx];
    if (!coin) return;
    tg?.HapticFeedback?.impactOccurred?.("light");
    currentDetailCoin = coin;
    window.currentDetailCoin = coin; // exposed for the type=module wallet/swap script below
    renderDetail(coin);
    document.getElementById("screen-detail").classList.add("active");
    document.getElementById("screen-list").classList.add("behind");
    document.getElementById("screen-detail").scrollTop = 0;
    tg?.BackButton?.show();
    loadChart("24h");
    window.refreshBuyUi?.();
  };
  window.copyAddr = function(addr, el){
    navigator.clipboard?.writeText(addr)?.then(() => {
      tg?.HapticFeedback?.notificationOccurred?.("success");
      const label = el?.querySelector(".addrtext");
      if (!label) return;
      const original = label.textContent;
      el.classList.add("copied");
      label.textContent = "Copied!";
      setTimeout(() => { el.classList.remove("copied"); label.textContent = original; }, 1200);
    }).catch(() => {});
  };

  window.showList = function(){
    tg?.HapticFeedback?.impactOccurred?.("light");
    document.getElementById("screen-detail").classList.remove("active");
    document.getElementById("screen-portfolio").classList.remove("active");
    document.getElementById("screen-list").classList.remove("behind");
    tg?.BackButton?.hide();
    window.hideMainButton?.();
  };

  window.showPortfolio = function(){
    tg?.HapticFeedback?.impactOccurred?.("light");
    document.getElementById("screen-portfolio").classList.add("active");
    document.getElementById("screen-list").classList.add("behind");
    document.getElementById("screen-portfolio").scrollTop = 0;
    tg?.BackButton?.show();
    renderPortfolio();
  };

  const fmtAmount = (n) => {
    n = Number(n) || 0;
    if (n >= 1000) return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
    if (n >= 1) return n.toLocaleString(undefined, { maximumFractionDigits: 4 });
    return n.toLocaleString(undefined, { maximumFractionDigits: 8 });
  };

  function portfolioRow(h){
    const img = h.imageUrl
      ? `<img src="${esc(h.imageUrl)}" loading="lazy" alt="" onerror="this.parentElement.innerHTML='<div class=fallback>${esc((h.symbol||'?')[0])}</div>'"/>`
      : `<div class="fallback">${esc((h.symbol||"?")[0])}</div>`;
    const idx = allCoins.findIndex(c => c.tokenAddress === h.address);
    const isTon = h.kind === "Ton";
    const tag = isTon ? "div" : "button";
    const onclick = isTon ? "" : idx >= 0
      ? ` onclick="showDetail(${idx})"`
      : ` onclick="window.open('${esc(buyUrl(h.address))}','_blank')"`;
    return `
      <${tag} class="spotlight"${onclick}>
        <div class="spot-media">${img}</div>
        <div class="spot-body">
          <div class="spot-top"><span class="spot-name">${esc(h.name)}</span></div>
          <div class="spot-ticker">${fmtAmount(h.amount)} $${esc(h.symbol)}</div>
        </div>
        <div class="spot-stats">
          <div class="spot-price tabular">${h.usd > 0 ? fmtUsd(h.usd) : "—"}</div>
        </div>
      </${tag}>`;
  }

  async function renderPortfolio(){
    const box = document.getElementById("portfolioContent");
    if (!box) return;
    box.innerHTML = `
      <div id="portfolioBody">
        <div class="spotlight spot-skel skel"></div>
        <div class="spotlight spot-skel skel"></div>
        <div class="spotlight spot-skel skel"></div>
      </div>`;

    // The wallet module (wallet-bundle.js) loads as a separate deferred
    // script — give it a moment to finish before deciding it's unavailable.
    for (let tries = 0; tries < 20 && !window.loadPortfolio; tries++) await sleep(200);
    const body = document.getElementById("portfolioBody");
    if (!body) return; // user navigated away while waiting

    if (!window.isWalletConnected?.()) {
      body.innerHTML = `<div class="state"><p>Connect your wallet to see what you hold.</p>
        <button class="buy" style="margin-top:14px" onclick="window.connectWallet?.()">Connect Wallet</button></div>`;
      return;
    }
    if (!window.loadPortfolio) {
      body.innerHTML = `<div class="state"><p>Wallet module unavailable — try reloading.</p></div>`;
      return;
    }

    const data = await window.loadPortfolio();
    if (document.getElementById("portfolioBody") !== body) return; // navigated away meanwhile
    if (!data) {
      body.innerHTML = `<div class="state"><p>Couldn't load your holdings — try again in a moment.</p></div>`;
      return;
    }

    box.insertAdjacentHTML("afterbegin", `
      <div class="dcard portfolio-head">
        <div class="k">Portfolio value</div>
        <div class="portfolio-total tabular">${fmtUsd(data.totalUsd)}</div>
      </div>`);
    if (!data.holdings.length) {
      body.innerHTML = `<div class="state"><p>No tokens yet — buy your first one from Trending.</p></div>`;
      return;
    }
    body.innerHTML = data.holdings.map(portfolioRow).join("");
  }

  window.setSort = function(mode){
    tg?.HapticFeedback?.selectionChanged?.();
    sortMode = mode;
    document.getElementById("sortVolume").classList.toggle("active", mode === "volume");
    document.getElementById("sortGainers").classList.toggle("active", mode === "gainers");
    renderGrid();
  };

  window.onSearch = function(){
    searchTerm = document.getElementById("search").value.trim().toLowerCase();
    renderGrid();
  };

  function renderGrid(){
    let list = allCoins.map((c, i) => ({ ...c, _idx: i }));
    if (searchTerm) {
      list = list.filter(c =>
        c.symbol.toLowerCase().includes(searchTerm) ||
        c.name.toLowerCase().includes(searchTerm));
    }
    list = list.sort((a, b) => sortMode === "gainers"
      ? b.change24h - a.change24h
      : b.volume24h - a.volume24h);

    document.getElementById("countpill").textContent = list.length;
    document.getElementById("spotEyebrow").textContent = "Top by " + (sortMode === "gainers" ? "gainers" : "volume");

    const spotEl = document.getElementById("spotlight");
    const gridEl = document.getElementById("grid");

    if (!list.length) {
      spotEl.innerHTML = "";
      gridEl.innerHTML = `<div class="state">${emptyIcon()}<div style="margin-top:10px">No matches for "<b>${esc(searchTerm)}</b>"</div></div>`;
      return;
    }

    const [top, ...rest] = list;
    spotEl.innerHTML = renderSpotlight(top, top._idx);
    gridEl.innerHTML = rest.map((c, i) => renderCard(c, c._idx, i * 30)).join("");
  }

  function setLive(state){
    const el = document.getElementById("liveIndicator");
    el.classList.toggle("err", state === "error");
    el.title = state === "loading" ? "loading" : state === "error" ? "error" : "live";
  }

  let lastLoadAt = 0;
  async function load(){
    // A full load fires ~11 GeckoTerminal requests in one burst (roughly a
    // third of their free-tier 30/min budget) — a cooldown here stops an
    // accidental double-tap on refresh, or an eager pull-to-refresh, from
    // compounding into a rate-limit error the user didn't really cause.
    const now = Date.now();
    if (lastLoadAt && now - lastLoadAt < 10000) {
      tg?.HapticFeedback?.notificationOccurred?.("warning");
      const btn0 = document.getElementById("refreshBtn");
      if (btn0) { btn0.classList.add("spin"); setTimeout(() => btn0.classList.remove("spin"), 300); }
      return;
    }
    lastLoadAt = now;

    const btn = document.getElementById("refreshBtn");
    btn.classList.add("spin");
    setLive("loading");
    document.getElementById("spotlight").innerHTML = `<div class="skel spot-skel"></div>`;
    document.getElementById("grid").innerHTML = Array(9).fill(0).map(skeletonCard).join("");
    try {
      // Step 1: top pools by 24h volume
      const poolsRes = await fetchJson(`${GT_BASE}/networks/${NETWORK}/pools?sort=h24_volume_usd_desc&page=1`);
      const pools = poolsRes?.data || [];

      // Dedupe to unique base tokens, skip pools where base==quote
      // (the pattern seen when TON itself gets listed as a "pool" — self-paired)
      const seen = new Set();
      const picks = [];
      for (const p of pools) {
        const baseId = p.relationships?.base_token?.data?.id || "";
        const quoteId = p.relationships?.quote_token?.data?.id || "";
        const addr = baseId.replace(/^ton_/, "");
        const quoteAddr = quoteId.replace(/^ton_/, "");
        if (!addr) continue;
        if (addr.toLowerCase() === quoteAddr.toLowerCase()) continue; // self-paired, skip
        if (seen.has(addr.toLowerCase())) continue;
        seen.add(addr.toLowerCase());
        const a = p.attributes || {};
        picks.push({
          tokenAddress: addr,
          poolAddress: a.address || null,
          priceUsd: Number(a.base_token_price_usd)||0,
          change24h: Number(a.price_change_percentage?.h24)||0,
          volume24h: Number(a.volume_usd?.h24)||0,
          marketCapUsd: a.market_cap_usd != null ? Number(a.market_cap_usd) : null,
          fdvUsd: a.fdv_usd != null ? Number(a.fdv_usd) : null,
          liquidityUsd: a.reserve_in_usd != null ? Number(a.reserve_in_usd) : null,
          poolCreatedAt: a.pool_created_at || null,
        });
        if (picks.length >= WANT) break;
      }

      if (!picks.length) throw new Error("no pools returned");

      // Step 2: rich token info per pick. Staggered (not all fired in the
      // same instant) — GeckoTerminal's free tier caps at 30 requests/min,
      // and 10 simultaneous connections in one burst is more likely to trip
      // abuse detection than the same 10 requests spread over ~1.5s.
      const infos = await Promise.all(picks.map((p, i) =>
        sleep(i * 150).then(() =>
          fetchJson(`${GT_BASE}/networks/${NETWORK}/tokens/${p.tokenAddress}/info`).catch(() => null)
        )
      ));

      allCoins = picks.map((p, i) => {
        const info = infos[i]?.data?.attributes || {};
        return {
          ...p,
          name: info.name || p.tokenAddress.slice(0,10),
          symbol: (info.symbol || "?").toUpperCase(),
          description: info.description || "",
          imageUrl: info.image_url || null,
          website: info.websites?.[0] || null,
          telegram: info.telegram_handle || null,
          twitter: info.twitter_handle || null,
          gtScore: info.gt_score ?? null,
          holderCount: info.holders?.count ?? null,
          holderTop10: info.holders?.distribution_percentage?.top_10 ?? null,
          is_honeypot: info.is_honeypot === "true" ? true : info.is_honeypot === "false" ? false : null,
          devHoldingPct: info.developer_holding_percentage ?? null,
          // Needed to format STON.fi's raw on-chain unit amounts (askUnits
          // etc.) back into a human token count — jettons don't all use 9
          // decimals like TON itself. Defaulting to 9 if GT doesn't have it
          // is a best guess, not verified against a token where it's != 9.
          decimals: info.decimals ?? 9,
          launchpad: launchpadFromDescription(info.description),
        };
      });

      renderGrid();
      setLive("live");
    } catch (e) {
      setLive("error");
      document.getElementById("countpill").textContent = "0";
      document.getElementById("spotlight").innerHTML = "";
      document.getElementById("grid").innerHTML =
        `<div class="state">${errorIcon()}<div style="margin-top:10px"><b>Couldn't load live data.</b><br/>${esc(e.message || e)}</div>
         <div style="margin-top:10px;font-size:11px;opacity:.7">Honest error, not a fallback — worth knowing before we deploy for real.</div></div>`;
    } finally {
      btn.classList.remove("spin");
    }
  }

  (function setupPullToRefresh(){
    const el = document.getElementById("screen-list");
    const ptr = document.getElementById("ptr");
    if (!el || !ptr) return;
    const THRESHOLD = 62;
    let startY = null, pulling = false, triggered = false;

    el.addEventListener("touchstart", (e) => {
      if (el.scrollTop > 0) { startY = null; pulling = false; return; }
      startY = e.touches[0].clientY;
      pulling = true;
      triggered = false;
      ptr.style.transition = "none";
    }, { passive: true });

    el.addEventListener("touchmove", (e) => {
      if (!pulling || startY == null) return;
      const dy = e.touches[0].clientY - startY;
      if (dy <= 0 || el.scrollTop > 0) { pulling = false; return; }
      const pull = Math.min(dy * 0.5, 90);
      const progress = Math.min(pull / THRESHOLD, 1);
      ptr.style.opacity = String(progress);
      ptr.style.transform = `translate(-50%, ${pull - 50}px) rotate(${progress * 180}deg)`;
      if (pull >= THRESHOLD && !triggered) { triggered = true; tg?.HapticFeedback?.impactOccurred?.("medium"); }
      else if (pull < THRESHOLD && triggered) { triggered = false; }
    }, { passive: true });

    el.addEventListener("touchend", () => {
      if (!pulling) return;
      pulling = false;
      ptr.style.transition = "transform .25s ease, opacity .25s ease";
      if (triggered) {
        ptr.classList.add("spinning");
        ptr.style.transform = "translate(-50%, 8px) rotate(0deg)";
        ptr.style.opacity = "1";
        load().finally(() => {
          ptr.classList.remove("spinning");
          ptr.style.transform = "translate(-50%, -50px)";
          ptr.style.opacity = "0";
        });
      } else {
        ptr.style.transform = "translate(-50%, -50px)";
        ptr.style.opacity = "0";
      }
      startY = null;
      triggered = false;
    });
  })();

  load();
</script>

<!-- ===================== Part 2: embedded wallet + swap ===================== -->
<!-- Wallet-connect + swap logic, pre-bundled locally with esbuild (see
     wallet-build/) instead of loaded from a CDN at runtime. Two different
     CDNs (esm.sh, then jsdelivr's +esm) each failed to resolve
     @ston-fi/sdk's dependency tree correctly on a real device, with two
     different errors — bundling the actual npm packages at build time
     sidesteps that whole class of problem, since nothing resolves in the
     visitor's browser at all. To change wallet/swap behavior, edit
     wallet-build/entry.js, run `npm install && npm run build` in that
     directory, and commit the resulting wallet-bundle.js alongside it.
     Still not live-tested end-to-end with a real wallet approving a real
     transaction — the "Having trouble?" link on the Buy button is a
     working fallback to STON.fi's own swap page if anything here breaks. -->
<script src="wallet-bundle.js?v=11"></script>
</body>
</html>
